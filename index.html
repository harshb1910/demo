<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Tap Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hud">
        <div class="hud__title">Space Tap Runner</div>
        <div class="hud__score">Score: <span id="score">0</span></div>
      </header>
      <section class="game-shell">
        <canvas id="game" width="720" height="360" aria-label="Space Tap Runner"></canvas>
        <div class="overlay" id="overlay">
          <h1>Space Tap Runner</h1>
          <p>Press <span class="key">Space</span> to jump and avoid the meteors.</p>
          <button id="start" class="start">Start</button>
        </div>
        <div class="overlay overlay--hidden" id="gameover">
          <h2>Game Over</h2>
          <p>Your score: <span id="final-score">0</span></p>
          <button id="restart" class="start">Try Again</button>
        </div>
      </section>
      <footer class="tips">
        <p>Only input: <strong>Spacebar</strong>. Tap to jump, hold to float a little longer.</p>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
